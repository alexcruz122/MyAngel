<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nothing to see here yet — RedTrex Technologies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #020305;
      --red:     #cc1a1a;
      --red-dim: #7a0f0f;
      --white:   #e8e8e8;
      --grey:    #3a3a3a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      cursor: none;
    }

    /* ── scanlines overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.18) 2px,
        rgba(0,0,0,.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── vignette ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.85) 100%);
      pointer-events: none;
      z-index: 99;
    }

    /* ── layout ── */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 2rem;
      z-index: 1;
    }

    /* ── main glitch text ── */
    .glitch-wrap {
      position: relative;
      text-align: center;
      line-height: 1;
    }

    .glitch {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 7vw, 5.5rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.02em;
      position: relative;
      display: inline-block;
      animation: shake 6s infinite;
    }

    /* red chromatic aberration clone — behind */
    .glitch::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: var(--red);
      clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
      animation: glitch-r 3.5s infinite;
      opacity: .9;
    }

    /* cyan ghost clone — in front */
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: #1affea;
      clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
      animation: glitch-c 4.2s infinite;
      opacity: .75;
    }

    @keyframes glitch-r {
      0%,100%  { transform: translate(0);                    clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); }
      7%       { transform: translate(-6px, 2px);            clip-path: polygon(0 5%,  100% 5%,  100% 25%, 0 25%); }
      14%      { transform: translate(4px, -3px);            clip-path: polygon(0 55%, 100% 55%, 100% 70%, 0 70%); }
      21%      { transform: translate(-3px);                 clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%); }
      28%      { transform: translate(0);                    clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); }
      50%      { transform: translate(8px, 1px);             clip-path: polygon(0 0%,  100% 0%,  100% 15%, 0 15%); }
      57%      { transform: translate(-5px);                 clip-path: polygon(0 75%, 100% 75%, 100% 95%, 0 95%); }
      64%      { transform: translate(0);                    clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); }
    }

    @keyframes glitch-c {
      0%,100%  { transform: translate(0);                    clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
      10%      { transform: translate(6px, -2px);            clip-path: polygon(0 80%, 100% 80%, 100% 100%,0 100%); }
      20%      { transform: translate(-4px, 3px);            clip-path: polygon(0 40%, 100% 40%, 100% 58%, 0 58%); }
      30%      { transform: translate(0);                    clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
      55%      { transform: translate(-8px);                 clip-path: polygon(0 10%, 100% 10%, 100% 28%, 0 28%); }
      65%      { transform: translate(5px, -1px);            clip-path: polygon(0 65%, 100% 65%, 100% 85%, 0 85%); }
      75%      { transform: translate(0);                    clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); }
    }

    @keyframes shake {
      0%,100% { transform: translate(0); }
      92%     { transform: translate(0); }
      93%     { transform: translate(-3px, 1px); }
      94%     { transform: translate(3px, -1px); }
      95%     { transform: translate(-2px, 2px); }
      96%     { transform: translate(2px); }
      97%     { transform: translate(0); }
    }

    /* ── sub-text ── */
    .sub {
      font-size: clamp(.65rem, 1.6vw, .85rem);
      color: var(--grey);
      letter-spacing: .2em;
      text-transform: uppercase;
      animation: flicker 8s infinite;
    }

    @keyframes flicker {
      0%,100% { opacity: 1; }
      88%     { opacity: 1; }
      89%     { opacity: 0; }
      90%     { opacity: 1; }
      91%     { opacity: 0; }
      92%     { opacity: 1; }
    }

    /* ── blinking cursor bar ── */
    .cursor-bar {
      display: inline-block;
      width: clamp(1.8rem, 4vw, 3rem);
      height: 4px;
      background: var(--red);
      margin-left: 6px;
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0; }
    }

    /* ── noise canvas ── */
    #noise {
      position: fixed;
      inset: 0;
      opacity: .045;
      pointer-events: none;
      z-index: 2;
    }

    /* ── horizontal tear lines ── */
    .tear {
      position: fixed;
      left: 0; right: 0;
      height: 2px;
      background: var(--red-dim);
      opacity: 0;
      animation: tear-anim var(--d, 9s) var(--delay, 0s) infinite;
    }

    @keyframes tear-anim {
      0%,100%  { opacity: 0; top: var(--pos, 50%); }
      90%      { opacity: 0; top: var(--pos, 50%); }
      92%      { opacity: .7; top: calc(var(--pos, 50%) - 2px); }
      94%      { opacity: .4; top: calc(var(--pos, 50%) + 6px); }
      96%      { opacity: .6; top: var(--pos, 50%); }
      98%      { opacity: 0; }
    }

    /* ── eye flash overlay ── */
    #flash {
      position: fixed;
      inset: 0;
      background: var(--red);
      opacity: 0;
      pointer-events: none;
      z-index: 98;
      animation: flash-anim 14s infinite;
    }

    @keyframes flash-anim {
      0%,100% { opacity: 0; }
      85%     { opacity: 0; }
      85.2%   { opacity: .08; }
      85.5%   { opacity: 0; }
      86%     { opacity: .04; }
      86.2%   { opacity: 0; }
    }

    /* ── back link ── */
    .back {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: .7rem;
      color: var(--red-dim);
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color .2s;
      z-index: 10;
    }
    .back:hover { color: var(--red); }

    /* ── custom cursor ── */
    #cur {
      position: fixed;
      width: 10px; height: 10px;
      background: var(--red);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform .05s;
      z-index: 200;
      mix-blend-mode: screen;
    }

    @media (prefers-reduced-motion: reduce) {
      .glitch, .glitch::before, .glitch::after,
      .sub, .cursor-bar, .tear, #flash {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- noise grain -->
  <canvas id="noise"></canvas>

  <!-- custom cursor -->
  <div id="cur"></div>

  <!-- red flash -->
  <div id="flash"></div>

  <!-- tear lines -->
  <div class="tear" style="--pos:18%; --d:11s; --delay:1.2s;"></div>
  <div class="tear" style="--pos:43%; --d:8s;  --delay:3.7s;"></div>
  <div class="tear" style="--pos:67%; --d:13s; --delay:0.4s;"></div>
  <div class="tear" style="--pos:82%; --d:9s;  --delay:5s;"></div>

  <div class="stage">
    <div class="glitch-wrap">
      <span class="glitch" data-text="Nothing to see here yet.">Nothing to see here yet.</span>
    </div>
    <p class="sub">move along<span class="cursor-bar"></span></p>
  </div>

  <a class="back" href="/">Return home</a>

  <script>
    /* ── noise grain ── */
    (function() {
      var canvas = document.getElementById('noise');
      var ctx    = canvas.getContext('2d');
      var W, H;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function drawNoise() {
        var img  = ctx.createImageData(W, H);
        var data = img.data;
        for (var i = 0; i < data.length; i += 4) {
          var v = Math.random() * 255 | 0;
          data[i] = data[i+1] = data[i+2] = v;
          data[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        requestAnimationFrame(drawNoise);
      }
      drawNoise();
    })();

    /* ── custom cursor ── */
    (function() {
      var cur = document.getElementById('cur');
      document.addEventListener('mousemove', function(e) {
        cur.style.left = e.clientX + 'px';
        cur.style.top  = e.clientY + 'px';
      });
    })();
  </script>
</body>
</html>
